<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>挪车通知 · 车主端</title>
<link rel="stylesheet" href="static/app.css?v=4">
</head>
<body>
<div class="wrap">
  <div id="boot" class="card center"><p class="muted">加载中…</p></div>

  <div id="app" class="hide">
    <div class="hero">
      <div class="row between" style="margin-bottom:8px">
        <span class="muted tiny">挪车通知 · 车主端</span>
        <span id="live" class="pill warn"><span class="dot"></span><span>连接中</span></span>
      </div>
      <div class="big-plate plate" id="plate">—</div>
      <div class="muted" id="muted2" style="margin-top:6px"></div>
    </div>

    <div class="row between" style="margin:0 2px 10px">
      <h3 style="margin:0">待处理 <span id="pendingN" class="pill err">0</span></h3>
      <button class="ghost sm" id="refresh">刷新</button>
    </div>

    <div id="list"></div>

    <p class="muted tiny center" id="foot"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CODE = (new URLSearchParams(location.search).get('u') || '').trim();
let seen = new Set(), audioCtx = null, es = null;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function p2(n){ return String(n).padStart(2,'0'); }
function fmt(ts){
  const d = new Date(ts*1000), diff = Date.now()/1000 - ts;
  const hm = p2(d.getHours())+':'+p2(d.getMinutes());
  if(diff < 60) return '刚刚';
  if(diff < 600) return Math.floor(diff/60)+' 分钟前';
  const today = new Date(); 
  if(d.toDateString() === today.toDateString()) return '今天 '+hm;
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
async function api(path, body){
  const r = await fetch(path, {method: body===undefined?'GET':'POST',
    headers: body===undefined?{}:{'Content-Type':'application/json'},
    body: body===undefined?undefined:JSON.stringify(body)});
  const j = await r.json().catch(()=>({ok:false,error:'HTTP '+r.status}));
  if(!r.ok || j.ok===false) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.5);
    o.start(); o.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}
function navLinks(c){
  if(c.glat==null||c.glng==null) return '';
  const g = `${c.glng.toFixed(6)},${c.glat.toFixed(6)}`;
  const amap = `https://uri.amap.com/marker?position=${g}&name=${encodeURIComponent('挪车位置')}&coordinate=gaode&callnative=1`;
  const apple = `https://maps.apple.com/?ll=${c.glat.toFixed(6)},${c.glng.toFixed(6)}&q=${encodeURIComponent('挪车位置')}`;
  return `<div class="row" style="margin-top:8px">
    <a class="btn sm soft" href="${amap}" target="_blank" rel="noopener">高德导航</a>
    <a class="btn sm ghost" href="${apple}" target="_blank" rel="noopener">苹果地图</a>
    <span class="muted tiny">精度 ${c.accuracy?Math.round(c.accuracy)+'m':'未知'}</span>
  </div>`;
}

function render(calls){
  const list = $('#list');
  if(!calls.length){ list.innerHTML = '<div class="card center muted">暂无呼叫，有人扫码时会在这里出现。</div>'; $('#pendingN').textContent = '0'; return; }
  const pending = calls.filter(c=>!c.acked_at).length;
  $('#pendingN').textContent = pending;
  $('#pendingN').className = 'pill ' + (pending ? 'err' : 'ok');
  list.innerHTML = calls.map(c=>`
    <div class="call-item ${c.acked_at?'done':''} ${seen.has(c.id)&&!c.acked_at?'new':''}" data-id="${c.id}">
      <div class="row between">
        <div><b>${esc(c.reason||'请挪车')}</b></div>
        <span class="muted tiny call-time">${fmt(c.created_at)}</span>
      </div>
      ${c.note?`<div class="muted" style="margin-top:4px">留言：${esc(c.note)}</div>`:''}
      ${navLinks(c)}
      <div class="row" style="margin-top:10px">
        ${c.acked_at
          ? `<span class="pill ok"><span class="dot"></span><span>已处理</span></span>`
          : `<button class="sm" onclick="ack(${c.id})">我已处理</button>
             ${(c.glat==null)?'<span class="muted tiny">对方未授权定位</span>':''}`}
      </div>
    </div>`).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function ack(id){
  try{ await api('api/ack', {code:CODE, id}); toast('已标记处理'); await load(); }
  catch(e){ toast(e.message); }
}

async function load(){
  try{
    const r = await api('api/calls/'+encodeURIComponent(CODE));
    $('#boot').classList.add('hide'); $('#app').classList.remove('hide');
    const o = r.owner;
    $('#plate').textContent = o.plate || o.code;
    $('#muted2').textContent = o.note || '';
    document.title = (o.plate||'车主') + ' · 挪车通知';
    render(r.calls||[]);
  }catch(e){
    $('#boot').innerHTML = '<h2>无法加载</h2><p class="muted">'+esc(e.message)+'</p>';
  }
}

function connect(){
  if(es) es.close();
  es = new EventSource('api/stream/'+encodeURIComponent(CODE));
  es.onopen = ()=>{ $('#live').className='pill ok'; $('#live').innerHTML='<span class="dot"></span><span>实时</span>'; };
  es.onerror = ()=>{ $('#live').className='pill warn'; $('#live').innerHTML='<span class="dot"></span><span>重连中</span>'; };
  es.addEventListener('call', e=>{
    const d = JSON.parse(e.data); seen.add(d.id); beep(); load();
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
  });
  es.addEventListener('ack', ()=>load());
}

$('#refresh').onclick = load;
load();
connect();
</script>
</body>
</html>
